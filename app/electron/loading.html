<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lama Annotation Studio</title>
    <style>
        body {
            background: #0e1116;
            color: #e8edf4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            flex-direction: column;
        }

        .brand {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            margin-bottom: 28px;
        }

        .brand span {
            color: #2dd4bf;
        }

        .loader {
            border: 3px solid rgba(255, 255, 255, 0.08);
            border-top: 3px solid #2dd4bf;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        .status {
            color: #8b95a5;
            font-size: 0.9rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div class="brand">Lama <span>Studio</span></div>
    <div class="loader"></div>
    <div class="status">Starting Annotation Studio…</div>
</body>

</html>
