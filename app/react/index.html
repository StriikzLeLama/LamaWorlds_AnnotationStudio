<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lama Worlds Annotation Studio</title>
  <!-- Typo UI : Outfit (titres) + DM Sans (corps) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
</head>

<body>
  <div id="root">Chargement de l&apos;interface…</div>
  <div id="error-display" style="color: #f87171; padding: 20px; font-family: ui-monospace, monospace; white-space: pre-wrap;"></div>
  <script>
    window.onerror = function (message, source, lineno, colno, error) {
      document.getElementById('error-display').innerHTML += `Error: ${message}\nSource: ${source}:${lineno}\n\n`;
    };
    window.onunhandledrejection = function (event) {
      document.getElementById('error-display').innerHTML += `Promise Rejection: ${event.reason}\n\n`;
    };
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
